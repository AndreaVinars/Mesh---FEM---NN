name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tooling
        run: python -m pip install ruff==0.12.0

      - name: Run Ruff
        run: python -m ruff check Main Pipeline tests

      - name: Compile Python sources
        run: python -m compileall -q Main Pipeline tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
